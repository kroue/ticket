<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtMo Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            background: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .profile-header {
            display: flex;
            align-items: center;
            padding: 8px 20px;
            background: #eeeeee;
        }

        .profile-avatar {
            width: 48px;
            height: 48px;
            background: #333;
            border-radius: 0px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            margin-right: 12px;
        }

        .profile-info {
            flex: 1;
        }

        .profile-name {
            font-size: 16px;
            font-weight: bolder;
            color: #1a1a1a;
            margin-bottom: 2px;
        }

        .profile-details {
            font-size: 13px;
            color: #666;
        }

        .more-button {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 33px;
            color: #333;
        }

        .messages-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: white;
        }

        .message-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            margin-bottom: 12px;
        }

        .message-wrapper.sent {
            justify-content: flex-end;
        }

        .message-bubble {
            display: inline-block;
            background: #f0f0f0;
            padding: 12px 16px;
            border-radius: 13px 13px 13px 0;
            max-width: 70%;
            padding: 8px 39px 8px 10px;
        }

        .message-bubble.sent {
            background: #2d2d2d;
            color: white;
            border-radius: 10px 10px 0 10px;
            padding: 5px 16px 5px 16px;
        }

        .message-text {
            font-size: 15px;
            color: #333;
            line-height: 1.4;
            font-family: 'Montserrat', sans-serif;
        }

        .message-bubble.sent .message-text {
            color: white;
        }

        .message-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
            min-width: 200px;
        }

        .message-icon {
            width: auto;
            height: 23px;
            opacity: 0.6;
            object-fit: contain;
            margin-left: auto;
            margin-right: -32px;
        }

        .message-time {
            font-size: 15px;
            color: #000000;
            font-weight: 400;
            white-space: nowrap;
            font-family: 'Montserrat', sans-serif;
        }

        .delete-button {
            background: #2d2d2d;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: 8px;
        }

        .input-area {
            background: #f0f0f0;
            padding: 16px 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .input-container {
            background: white;
            border-radius: 0px;
            padding: 12px 16px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            height: 100px;
        }

        .button-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .input-icons {
            display: flex;
            gap: 8px;
        }

        .icon-button {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }

        .icon-button svg {
            width: 24px;
            height: 24px;
        }

        .message-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 17px;
            color: #333;
            background: transparent;
            font-family: 'Montserrat', sans-serif;
        }

        .message-input::placeholder {
            color: #999;
        }

        .char-count {
            font-size: 18px;
            color: #999;
            margin-right: 8px;
            align-self: center;
        }

        .send-button {
            background: #1a1a1a;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Montserrat', sans-serif;
        }

        .send-button:hover {
            background: #333;
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <!-- Profile Header -->
        <div class="profile-header">
            <div class="profile-avatar">MO</div>
            <div class="profile-info">
                <div class="profile-name">julian amfon</div>
                <div class="profile-details">Member • California City, California • United States</div>
            </div>
            <div class="more-button">⋮</div>
        </div>

        <!-- Messages Area -->
        <div class="messages-area">
            <div class="message-wrapper">
                <div class="message-bubble">
                    <div class="message-text">Hi, do you have a minute?</div>
                    <div class="message-meta">
                        <img src="report.png" alt="report" class="message-icon">
                    </div>
                </div>
                <span class="message-time">2mins</span>
            </div>

            <div class="message-wrapper sent">
                <span class="message-time">1min</span>
                <div class="message-bubble sent">
                    <div class="message-text">Yeah?</div>
                </div>
            </div>

            <div class="message-wrapper">
                <div class="message-bubble">
                    <div class="message-text">Free Artmo Gift Card<br>https://artmo.com/free-artmo-giftcard</div>
                    <div class="message-meta">
                        <img src="report.png" alt="report" class="message-icon">
                    </div>
                </div>
                <span class="message-time">now</span>
            </div>

            <div class="message-wrapper sent">
                <span class="message-time">now</span>
                <div class="message-bubble sent">
                    <div class="message-text">i just click the link and fill it up but nothing happened can you please help me?</div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-container">
                <input type="text" class="message-input" placeholder="Type your message here...">
                <span class="char-count">2000</span>
            </div>
            <div class="button-row">
                <div class="input-icons">
                    <button class="icon-button">
                        <img src="emojij.png" alt="emoji"
                            style="width: 200px;height: 35px;object-fit: contain;margin-left: 33px;"> </button>

                </div>
                <img src="send.png" alt="send" style="cursor: pointer;height: 42px;width: auto;margin-right: 0px;">
            </div>
        </div>
    </div>
</body>

</html>
